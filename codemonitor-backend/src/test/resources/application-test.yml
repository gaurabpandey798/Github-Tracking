spring:
  datasource:
    url: jdbc:h2:mem:ideax_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

github:
  api:
    base-url: http://localhost:8089
    version: 2022-11-28
  organization: MBMC-IdeaX
  token: mock-test-token
  webhook:
    secret: my-test-webhook-secret-key-123456

security:
  admin:
    username: admin
    password: password123

monitoring:
  large-commit:
    files-threshold: 50
    lines-threshold: 500
  sudden-activity:
    commits-threshold: 5
    window-minutes: 10
  bulk-change:
    files-factor: 2.0
